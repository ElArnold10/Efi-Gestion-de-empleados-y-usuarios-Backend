[phases.setup]
nixPkgs = ["nodejs_24", "npm-8_x"]

[phases.install]
cmds = ["cd backend && npm ci"]

[phases.build]
cmds = [
  "cp ../sistema_horarios.sql backend/ 2>/dev/null || echo 'SQL file not found, continuing...'",
  "cd backend && npm install"
]

[start]
cmd = "cd backend && npm start"

[healthcheck]
path = "/health"
interval = "30s"
timeout = "10s"
retries = 3

# Las variables de entorno de Railway se inyectan automáticamente
# No es necesario definirlas aquí si existen en el dashboard
