[phases.setup]
nixPkgs = ["nodejs_24", "npm-8_x"]

[phases.install]
cmds = ["cd backend && npm ci"]

[phases.build]
cmds = ["cd backend && npm run db:sync"]

[start]
cmd = "cd backend && npm start"

[healthcheck]
path = "/health"
interval = "30s"
timeout = "10s"
retries = 3

[variables]
NODE_ENV = "production"
DB_HOST = "${{RAILWAY_PRIVATE_MYSQL_HOST}}"
DB_PORT = "${{RAILWAY_PRIVATE_MYSQL_PORT}}"
DB_NAME = "${{RAILWAY_PRIVATE_MYSQL_DATABASE}}"
DB_USER = "${{RAILWAY_PRIVATE_MYSQL_USER}}"
DB_PASSWORD = "${{RAILWAY_PRIVATE_MYSQL_PASSWORD}}"
JWT_SECRET = "${{JWT_SECRET}}"
JWT_EXPIRES_IN = "24h"
BCRYPT_ROUNDS = "10"
